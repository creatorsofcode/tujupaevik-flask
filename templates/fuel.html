{% extends "base.html" %}
{% block title %}Kui palju energiat mul on?{% endblock %}
{% block content %}
<h1>Kui palju energiat mul on?</h1>
<form method="post" class="slider-form">
  <output id="fuelOut" for="fuelRange">50</output>
  <input type="range" id="fuelRange" name="fuel" min="0" max="100" value="50"
         oninput="fuelOut.value = this.value">
  <button type="submit" class="btn">Kinnita</button>
</form>
{% endblock %}
